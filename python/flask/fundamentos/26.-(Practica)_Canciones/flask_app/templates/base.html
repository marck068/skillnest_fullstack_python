<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Canciones{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>
<body>

<nav class="navbar navbar-expand bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('usuarios') }}">🎵 Canciones</a>
        <div class="navbar-nav">
            <a class="nav-link" href="{{ url_for('usuarios') }}">Usuarios</a>
            <a class="nav-link" href="{{ url_for('canciones') }}">Canciones</a>
        </div>
    </div>
</nav>

<main class="container py-5">

    {% with mensajes = get_flashed_messages(with_categories=true) %}
        {% for categoria, mensaje in mensajes %}
            <div class="alert alert-{{ categoria }}" role="alert">{{ mensaje }}</div>
        {% endfor %}
    {% endwith %}

    {% block contenido %}{% endblock %}

</main>

</body>
</html>

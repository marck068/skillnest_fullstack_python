<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="marcelorios@liceovvh.cl">
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <main class="page-shell" aria-label="Pagina de inicio de sesion y registro">
        <section class="forms-panel" aria-label="Acceso de usuarios">
            <form class="auth-form login-card" action="{{ url_for('login') }}" method="post" id="loginForm">
                <h1>Inicio de Sesión</h1>

                <label>
                    <span>E-mail</span>
                    <input type="email" name="loginEmail" autocomplete="email" required>
                </label>

                <label>
                    <span>Contraseña</span>
                    <input type="password" name="loginPassword" autocomplete="current-password" required>
                </label>

                <button class="submit-button" type="submit">Iniciar Sesión</button>
            </form>

            <form class="auth-form register-card" action="{{ url_for('register') }}" method="post" id="registerForm">
                <h2>Registro</h2>

                <label>
                    <span>Nombre</span>
                    <input type="text" name="name" autocomplete="name" required>
                </label>

                <label>
                    <span>E-mail</span>
                    <input type="email" name="email" autocomplete="email" required>
                </label>

                <label>
                    <span>Contraseña</span>
                    <input type="password" name="password" autocomplete="new-password" required>
                </label>

                <label>
                    <span>Conf. Contraseña</span>
                    <input type="password" name="confirmPassword" autocomplete="new-password" required>
                </label>

                <button class="submit-button" type="submit">Registrar</button>
            </form>
        </section>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="status-message" role="status" aria-live="polite">
            {% for category, message in messages %}
                <p class="flash {{ category }}">{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}
    </main>
</body>

</html>

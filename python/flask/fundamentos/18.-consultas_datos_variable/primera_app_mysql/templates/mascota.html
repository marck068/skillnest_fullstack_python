<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {{ mascota.nombre }}
    </title>

</head>


<body>

    <h1>
        {{ mascota.nombre }}
    </h1>


    <p>

        <strong>
            ID:
        </strong>

        {{ mascota.id }}

    </p>


    <p>

        <strong>
            Nombre:
        </strong>

        {{ mascota.nombre }}

    </p>


    <p>

        <strong>
            Tipo:
        </strong>

        {{ mascota.tipo }}

    </p>


    <p>

        <strong>
            Color:
        </strong>

        {{ mascota.color }}

    </p>


    <p>

        <strong>
            Fecha de creación:
        </strong>

        {{ mascota.created_at }}

    </p>


    <p>

        <strong>
            Última actualización:
        </strong>

        {{ mascota.updated_at }}

    </p>


    <hr>


    <h2>
        Acciones
    </h2>


    <p>

        <a href="{{ url_for('index') }}">
            Volver al listado
        </a>

    </p>


    <p>

        <a
            href="{{ url_for(
                'mascotas_por_tipo',
                tipo=mascota.tipo
            ) }}"
        >
            Ver otras mascotas de tipo {{ mascota.tipo }}
        </a>

    </p>

</body>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Juego del Destino</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Fondo espacial decorativo -->
    <div class="fondo-espacial">
        <div class="estrellas"></div>
        <div class="particula p1"></div>
        <div class="particula p2"></div>
        <div class="particula p3"></div>
        <div class="particula p4"></div>
    </div>

    <div class="contenedor">
        <div class="tarjeta">

            <div class="tarjeta-encabezado">
                <div class="icono-circular">🌙</div>
                <h1>El Juego del Destino</h1>
                <p class="subtitulo">Descubre un pequeño vistazo de tu futuro</p>
            </div>

            <div class="tarjeta-cuerpo">
                <form action="/enviar" method="POST" class="formulario">

                    <div class="campo">
                        <label for="nombre">👤 Nombre</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                    </div>

                    <div class="campo">
                        <label for="edad">🎂 Edad</label>
                        <input type="number" id="edad" name="edad" placeholder="Tu edad" min="1" max="120" required>
                    </div>

                    <div class="campo">
                        <label for="color">🎨 Color favorito</label>
                        <input type="text" id="color" name="color" placeholder="Ej. rojo, azul, verde, morado, amarillo..." required>
                    </div>

                    <div class="campo">
                        <label for="animal">🐾 Animal favorito</label>
                        <input type="text" id="animal" name="animal" placeholder="Ej. perro, gato, águila, león, delfín..." required>
                    </div>

                    <button type="submit" class="boton-principal">✨ Revelar mi destino</button>

                </form>
            </div>

        </div>
    </div>

</body>
</html>

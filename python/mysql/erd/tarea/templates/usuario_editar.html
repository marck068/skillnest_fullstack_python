<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="marcelorios@liceovvh.cl">
    <title>Editar Usuario</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <main class="page-shell" aria-label="Editar usuario">
        <header class="page-header">
            <span class="page-title">Editar Usuario</span>
            <div class="header-actions">
                <a href="{{ url_for('dashboard_admin') }}" class="action-button">Volver</a>
                <a href="{{ url_for('logout') }}" class="nav-button">Salir</a>
            </div>
        </header>

        <section class="forms-panel" aria-label="Editar usuario">
            <form class="auth-form register-card" action="{{ url_for('edit_user', user_id=user.id) }}" method="post" id="userForm">
                <h1>Editar Usuario</h1>

                <label>
                    <span>Nombre</span>
                    <input type="text" name="name" value="{{ user.nombre }}" autocomplete="name" required>
                </label>

                <label>
                    <span>E-mail</span>
                    <input type="email" name="email" value="{{ user.email }}" autocomplete="email" required>
                </label>

                <label>
                    <span>Contraseña</span>
                    <input type="password" name="password" autocomplete="new-password">
                </label>

                <label>
                    <span>Conf. Contraseña</span>
                    <input type="password" name="confirmPassword" autocomplete="new-password">
                </label>

                <label>
                    <span>Tipo de Usuario</span>
                    <select name="role" required>
                        <option value="Administrador" {% if user.tipo_usuario == 'Administrador' %}selected{% endif %}>Administrador</option>
                        <option value="Usuario" {% if user.tipo_usuario == 'Usuario' %}selected{% endif %}>Usuario</option>
                    </select>
                </label>

                <button class="submit-button" type="submit">Guardar</button>
            </form>
        </section>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="status-message" role="status" aria-live="polite">
            {% for category, message in messages %}
                <p class="flash {{ category }}">{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}
    </main>
</body>

</html>

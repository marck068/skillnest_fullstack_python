<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mascotas</title>

</head>

<body>

    <h1>Listado de Mascotas</h1>

    <p>
        <a href="/usuarios">Ver usuarios</a>
    </p>

    {% if mascotas %}

        <ul>

            {% for mascota in mascotas %}

                <li>

                    <a href="/mascotas/{{ mascota.id }}">
                        <strong>{{ mascota.nombre }}</strong>
                    </a>

                    -

                    {{ mascota.tipo }}

                    -

                    {{ mascota.color }}

                </li>

            {% endfor %}

        </ul>

    {% else %}

        <p>
            No existen mascotas registradas.
        </p>

    {% endif %}

</body>

</html>

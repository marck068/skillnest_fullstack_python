<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado de Frutas</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Hoja de estilos propia -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<!-- Barra de navegación -->
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
             Mercado de Frutas
        </a>
        <div>
            <a class="nav-link text-white d-inline" href="{{ url_for('index') }}">Inicio</a>
            <a class="nav-link text-white d-inline" href="{{ url_for('catalogo') }}">Catálogo</a>
        </div>
    </div>
</nav>

<!-- Encabezado -->
<header class="hero text-center text-white">
    <div class="container">
        <h1>Frutas Frescas a Tu Puerta</h1>
        <p>Selecciona tus frutas favoritas y realiza tu pedido.</p>
    </div>
</header>

<!-- Formulario -->
<form action="{{ url_for('checkout') }}" method="POST">
<div class="container mt-5 mb-5">
<div class="row">

    <!-- Lista de frutas -->
    <div class="col-lg-8">
        <div class="card shadow">
            <div class="card-header">
                <h3>Selecciona tus frutas</h3>
            </div>
            <div class="card-body">
                <div class="row">
                    {% for fruta in frutas %}
                    <div class="col-md-6 mb-4">
                        <div class="card fruta-card h-100 shadow-sm">
                            <img src="{{ url_for('static', filename='images/' + fruta.imagen) }}"
                                 class="card-img-top" alt="{{ fruta.nombre }}">
                            <div class="card-body">
                                <h5 class="card-title">{{ fruta.nombre }}</h5>
                                <h6 class="text-success fw-bold">${{ fruta.precio }}</h6>
                                <p class="card-text">{{ fruta.descripcion }}</p>
                            </div>
                            <div class="card-footer bg-white">
                                <div class="input-group cantidad-selector">
                                    <button class="btn btn-outline-secondary btn-restar" type="button">-</button>
                                    <input type="number" class="form-control text-center"
                                           min="0" value="0" name="{{ fruta.nombre }}">
                                    <button class="btn btn-outline-secondary btn-sumar" type="button">+</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>

    <!-- Información del cliente -->
    <div class="col-lg-4">
        <div class="card shadow">
            <div class="card-header">
                <h3>Información de Contacto</h3>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-control" name="nombre" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Dirección de entrega</label>
                    <textarea class="form-control" rows="3" name="direccion" required></textarea>
                </div>

                <hr>

                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-cart-fill"></i> Crear Orden
                </button>
            </div>
        </div>
    </div>

</div>
</div>
</form>

<!-- Pequeño script solo para los botones +/- de cantidad (mejora de UX) -->
<script>
document.querySelectorAll('.cantidad-selector').forEach(function (grupo) {
    var input = grupo.querySelector('input[type="number"]');
    grupo.querySelector('.btn-sumar').addEventListener('click', function () {
        input.value = parseInt(input.value || 0) + 1;
    });
    grupo.querySelector('.btn-restar').addEventListener('click', function () {
        var valor = parseInt(input.value || 0) - 1;
        input.value = valor < 0 ? 0 : valor;
    });
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Usuarios</title>

</head>

<body>

    <h1>Listado de Usuarios</h1>

    <p>
        <a href="/">&larr; Volver a mascotas</a>
    </p>

    {% if usuarios %}

        <table border="1" cellpadding="8" cellspacing="0">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Edad</th>
                </tr>
            </thead>

            <tbody>

                {% for usuario in usuarios %}

                    <tr>
                        <td>{{ usuario.id }}</td>
                        <td>{{ usuario.nombre }}</td>
                        <td>{{ usuario.email }}</td>
                        <td>{{ usuario.edad }}</td>
                    </tr>

                {% endfor %}

            </tbody>

        </table>

    {% else %}

        <p>
            No existen usuarios registrados.
        </p>

    {% endif %}

</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="marcelorios@liceovvh.cl">
    <title></title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="contenedor">

        <!-- LOGIN -->
        <div class="caja">

            <h1>Inicio de Sesión</h1>

            <form class="formulario">

                <div class="grupo">
                    <label>E-mail</label>
                    <input type="email">
                </div>

                <div class="grupo">
                    <label>Contraseña</label>
                    <input type="password">
                </div>

                <button class="btn-registro">
                    Iniciar Sesión
                </button>

            </form>

        </div>

        <!-- REGISTRO -->
        <div class="caja">

            <h1>Registro</h1>

            <form class="formulario">

                <div class="grupo">
                    <label>Nombre</label>
                    <input type="text">
                </div>

                <div class="grupo">
                    <label>E-mail</label>
                    <input type="email">
                </div>

                <div class="grupo">
                    <label>Contraseña</label>
                    <input type="password">
                </div>

                <div class="grupo">
                    <label>Conf. Contraseña</label>
                    <input type="password">
                </div>

                <button class="btn-registro">
                    Registrar
                </button>

            </form>

        </div>

    </div>
</body>

</html>

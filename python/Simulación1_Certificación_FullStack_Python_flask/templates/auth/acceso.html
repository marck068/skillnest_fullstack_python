{% extends "base.html" %}
{% block title %}Login / Registro{% endblock %}
{% block content %}
<div class="text-center mb-4">
  <h1 class="brand-logo"><i class="bi bi-book-half"></i> BookHub</h1>
  <p class="mb-0">Comparte, descubre y comenta libros</p>
</div>

<div class="card-panel">
  <div class="row g-4">
    <!-- Crear cuenta -->
    <div class="col-md-7">
      <div class="inner-box h-100">
        <h2 class="h5 fw-bold mb-3">Crear Cuenta</h2>
        <form method="post" action="{{ url_for('auth.registro') }}" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="row mb-2 align-items-center">
            <label class="col-sm-5 col-form-label" for="nombre">Nombre</label>
            <div class="col-sm-7"><input class="form-control form-control-sm" id="nombre" name="nombre" minlength="2" maxlength="50" required value="{{ registro.get('nombre', '') }}"></div>
          </div>
          <div class="row mb-2 align-items-center">
            <label class="col-sm-5 col-form-label" for="apellido">Apellido</label>
            <div class="col-sm-7"><input class="form-control form-control-sm" id="apellido" name="apellido" minlength="2" maxlength="50" required value="{{ registro.get('apellido', '') }}"></div>
          </div>
          <div class="row mb-2 align-items-center">
            <label class="col-sm-5 col-form-label" for="reg_email">E-mail</label>
            <div class="col-sm-7"><input type="email" class="form-control form-control-sm" id="reg_email" name="email" maxlength="120" required value="{{ registro.get('email', '') }}"></div>
          </div>
          <div class="row mb-2 align-items-center">
            <label class="col-sm-5 col-form-label" for="reg_password">Contraseña</label>
            <div class="col-sm-7"><input type="password" class="form-control form-control-sm" id="reg_password" name="password" minlength="8" required></div>
          </div>
          <div class="row mb-3 align-items-center">
            <label class="col-sm-5 col-form-label" for="confirmar">Confirmar Contraseña</label>
            <div class="col-sm-7"><input type="password" class="form-control form-control-sm" id="confirmar" name="confirmar" minlength="8" required></div>
          </div>
          <div class="text-center">
            <button type="submit" class="btn btn-dark px-5">Registrarse</button>
          </div>
        </form>
        <p class="mt-3 mb-0 small"><a href="{{ url_for('auth.login') }}">¿Ya tienes cuenta? Inicia sesión</a></p>
      </div>
    </div>

    <!-- Iniciar sesión -->
    <div class="col-md-5">
      <div class="inner-box h-100">
        <h2 class="h5 fw-bold mb-3">Iniciar Sesión</h2>
        <form method="post" action="{{ url_for('auth.login') }}" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-2">
            <label class="form-label mb-1" for="login_email">E-mail</label>
            <input type="email" class="form-control form-control-sm" id="login_email" name="email" required value="{{ login_email }}">
          </div>
          <div class="mb-3">
            <label class="form-label mb-1" for="login_password">Contraseña</label>
            <input type="password" class="form-control form-control-sm" id="login_password" name="password" required>
          </div>
          <div class="d-grid"><button type="submit" class="btn btn-dark">Iniciar Sesión</button></div>
        </form>
        <p class="mt-3 mb-0 small"><a href="{{ url_for('auth.registro') }}">¿No tienes cuenta? Regístrate</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

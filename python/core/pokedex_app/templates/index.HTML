<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav class="navbar navbar-dark bg-danger shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">⚡ Pokédex</a>
        </div>
    </nav>

    <div class="container mt-5">

        <h1 class="text-center mb-4">🔴 Pokédex</h1>

        <p class="text-center text-secondary">
            Lista de Pokémon disponibles.
        </p>

        {% if pokemones %}

        <div class="row">

            {% for pokemon in pokemones %}

            <div class="col-lg-3 col-md-4 col-sm-6 mb-4">

                <div class="card shadow h-100">

                    <img
                        src="{{ url_for('static', filename='img/bullbasaur.png' ~ pokemon.imagen) }}"
                        class="card-img-top p-3"
                        alt="{{ pokemon.nombre }}">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            {{ pokemon.nombre }}
                        </h5>

                        <p><strong>N°</strong> {{ pokemon.id }}</p>

                        <a href="/pokemon/{{ pokemon.nombre }}" class="btn btn-primary">
                            Ver detalles
                        </a>

                    </div>

                </div>

            </div>

            {% endfor %}

        </div>

        {% else %}

        <div class="alert alert-warning text-center">
            No hay Pokémon disponibles.
        </div>

        {% endif %}

        {% if error %}

        <div class="alert alert-danger text-center mt-4">
            {{ error }}
        </div>

        {% endif %}

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>

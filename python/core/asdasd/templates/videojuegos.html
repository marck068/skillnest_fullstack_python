<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videojuegos</title>
</head>
<body>

    <h1>Listado de Videojuegos</h1>

    <ul>
        {% for juego in videojuegos %}
            <li>
                {{ juego["nombre"] }}
                -
                {{ juego["plataforma"] }}
                ({{ juego["anio"] }})
            </li>
        {% endfor %}
    </ul>

</body>
</html>

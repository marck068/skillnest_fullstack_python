<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro e Inicio de Sesión</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="titulo"><h1>Sistema de Registro e Inicio de Sesión</h1></header>

    <!-- Mensajes flash -->
    {% with mensajes = get_flashed_messages(with_categories=true) %}
        {% if mensajes %}
        <div class="mensajes">
            {% for categoria, mensaje in mensajes %}
                <div class="alert {{ categoria }}">{{ mensaje }}</div>
            {% endfor %}
        </div>
        {% endif %}
    {% endwith %}

    <main class="contenedor">
        <section class="tarjeta">
            <h2>Registro</h2>
            <form action="/registrar" method="post">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" minlength="2" required>

                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido" minlength="2" required>

                <label for="email_r">E-mail</label>
                <input type="email" id="email_r" name="email" required>

                <label for="password_r">Contraseña</label>
                <input type="password" id="password_r" name="password" minlength="8" required>
                <small>Mínimo 8 caracteres, una mayúscula y un número.</small>

                <label for="confirmar">Confirmar contraseña</label>
                <input type="password" id="confirmar" name="confirmar_password" required>

                <label for="fecha">Fecha de nacimiento</label>
                <input type="date" id="fecha" name="fecha_nacimiento" required>

                <button type="submit">Registrarse</button>
            </form>
        </section>

        <section class="tarjeta">
            <h2>Iniciar sesión</h2>
            <form action="/login" method="post">
                <label for="email_l">E-mail</label>
                <input type="email" id="email_l" name="email" required>

                <label for="password_l">Contraseña</label>
                <input type="password" id="password_l" name="password" required>

                <button type="submit">Iniciar sesión</button>
            </form>
        </section>
    </main>
</body>
</html>

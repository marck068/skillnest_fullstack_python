<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="marcelorios@liceovvh.cl">
    <title>Editar Usuario</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <main class="page-shell" aria-label="Editar usuario">
        <header class="page-header">
            <a href="dashboard_admin.html" class="nav-button" aria-label="Volver">←</a>
            <a href="index.html" class="nav-button" aria-label="Inicio">⌂</a>
            <span class="page-title">Editar Usuario</span>
        </header>

        <section class="forms-panel">
            <form class="auth-form register-card" id="userForm">
                <h1>Editar Usuario</h1>

                <label>
                    <span>Nombre</span>
                    <input type="text" name="name" value="Patricia" autocomplete="name" required>
                </label>

                <label>
                    <span>E-mail</span>
                    <input type="email" name="email" value="patricia@codingdojo.com" autocomplete="email" required>
                </label>

                <label>
                    <span>Contraseña</span>
                    <input type="password" name="password" autocomplete="new-password" required>
                </label>

                <label>
                    <span>Conf. Contraseña</span>
                    <input type="password" name="confirmPassword" autocomplete="new-password" required>
                </label>

                <label>
                    <span>Tipo de Usuario</span>
                    <select name="role" required>
                        <option value="Administrador">Administrador</option>
                        <option value="Usuario">Usuario</option>
                    </select>
                </label>

                <button class="submit-button" type="submit">Guardar</button>
            </form>
        </section>

        <div class="status-message" id="statusMessage" role="status" aria-live="polite"></div>
    </main>

    <script src="static/js/script.js"></script>
</body>

</html>
